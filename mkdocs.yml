site_name: zxtoolbox
site_description: Windows、Mac、Linux 上常用重复任务工具集合
site_author: smallZh

docs_dir: docs
site_dir: site

theme:
  name: smzhbook

nav:
  - 首页: index.md
  - 文档:
      - zxtool配置文件: config_manager.md
      - 硬件基础信息: computer_info.md
      - Git项目配置: git_config.md
      - Markdown转PDF: mkpdf_manager.md
      - 图片处理: image_manager.md
      - MkDocs项目构建: mkdocs_manager.md
      - EPUB转Markdown: epub_manager.md
      - TOTP解析: totp.md
      - 视频音频提取: video_audio.md
      - 目录备份拷贝: backup_manager.md
      - HTTP静态文件服务: http_server.md
      - HTTP视频播放: http_video.md
      - Nginx站点配置: nginx_manager.md
      - Let's Encrypt证书: letsencrypt.md
      - 自签SSL证书: ssl_cert.md

plugins:
  - search:
      lang: ["zh", "en"]
      separator: "[\\s\\-\\.]+" 
      min_search_length: 2
      prebuild_index: false
      indexing: full

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/smallzh/zxtoolbox
